<div class="form-field{% if field.field.widget.input_type == 'checkbox' %} form-field-check{% endif %}">
{{ field.errors }}
{% if field.field.widget.input_type == 'checkbox' %}{{ field }}{{ field.label_tag }}{% else %}{{ field.label_tag }}{{ field }}{% endif %}
{% if field.help_text %}<span class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</span>{% endif %}
</div>
