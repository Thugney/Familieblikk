<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familieblikk – Moderne Visuelt Redesignforslag (Mobil & PC · Fiktive data)</title>
  <link rel="icon" href="../../budget/static/budget/icon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: 'Figtree';
      src: url('../../budget/static/budget/figtree-latin.woff2') format('woff2');
      font-weight: 400 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --green-dark: #0A3A2C;
      --green-mid: #0E4A38;
      --green-pri: #13614A;
      --mint: #9CC4A3;
      --mint-light: #E7F1EA;
      --canvas-bg: #E2E0D6;
      --cream: #F3F2EC;
      --surface: #FFFFFF;
      --border: #EBE9E0;
      --border-strong: #DCD9CC;
      --text-main: #061A2E;
      --text-muted: #4F5F5A;
      --red-bg: #FDE8E6;
      --red-txt: #8F1F1B;
      --amber-bg: #FFF6E8;
      --amber-txt: #7A4300;
      --blue-bg: #E8F1F5;
      --blue-txt: #1D4E68;
      --radius-sheet: 28px;
      --radius-card: 20px;
      --shadow-elevated: 0 24px 56px rgba(6, 26, 46, 0.14);
      --shadow-dock: 0 12px 28px rgba(6, 26, 46, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--canvas-bg);
      color: var(--text-main);
      font-family: 'Figtree', system-ui, -apple-system, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2.5px solid var(--green-pri);
      outline-offset: 2px;
    }

    h1, h2, h3, h4, p {
      margin: 0;
    }

    .section-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* =========================================================================
       DESIGN PREVIEW TOP CONTROL BAR (FICTIONAL DATA & ROLE/STATE SWITCHER)
       ========================================================================= */
    .preview-banner {
      background: var(--green-dark);
      color: #FFFFFF;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(156, 196, 163, 0.28);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .preview-banner-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preview-pill {
      background: var(--mint);
      color: var(--green-dark);
      font-weight: 800;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 99px;
    }

    .preview-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preview-ctrl-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 3px 8px;
      min-height: 44px;
    }

    .preview-ctrl-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--mint);
      white-space: nowrap;
    }

    .preview-ctrl-group select {
      background: transparent;
      border: none;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 2px;
      min-height: 44px;
    }

    .preview-ctrl-group select option {
      background: var(--green-dark);
      color: #FFFFFF;
    }

    /* =========================================================================
       EXISTING FAMILIEBLIKK LOADER (FAITHFUL TO budget/templates/budget/loader.html)
       ========================================================================= */
    .fb-loader {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 34%, rgba(156, 196, 163, 0.26), transparent 44%),
        linear-gradient(160deg, #F3F2EC 0%, #EEEDE5 58%, #E7F1EA 100%);
      color: #061A2E;
    }

    .fb-loader.active {
      display: grid;
    }

    .fb-loader__card {
      display: grid;
      justify-items: center;
      gap: 14px;
      min-width: min(290px, 88vw);
      padding: 28px 30px 24px;
      border: 1px solid rgba(19, 97, 74, 0.14);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 22px 54px rgba(6, 26, 46, 0.12);
    }

    .fb-loader__mark {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #FFFFFF;
      box-shadow: inset 0 0 0 1px rgba(19, 97, 74, 0.12), 0 10px 24px rgba(19, 97, 74, 0.12);
    }

    .fb-loader__svg {
      width: 48px;
      height: 48px;
      overflow: visible;
    }

    .fb-loader__rotor {
      transform-origin: 108px 108px;
      animation: fb-loader-turn 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    .fb-loader__tile {
      transform-box: fill-box;
      transform-origin: center;
      animation: fb-loader-pulse 1.5s ease-in-out infinite;
    }

    .fb-loader__tile--2 { animation-delay: 0.16s; }
    .fb-loader__tile--3 { animation-delay: 0.32s; }
    .fb-loader__tile--4 { animation-delay: 0.48s; }

    @keyframes fb-loader-turn {
      0%, 16% { transform: rotate(-8deg) scale(1); }
      48%, 64% { transform: rotate(82deg) scale(0.96); }
      100% { transform: rotate(262deg) scale(1); }
    }

    @keyframes fb-loader-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.72; transform: scale(0.9); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fb-loader__rotor, .fb-loader__tile {
        animation: none !important;
      }
    }

    /* =========================================================================
       LAYOUT SHELL: DESKTOP WORKSPACE + MOBILE / PHONE FRAME
       ========================================================================= */
    .workspace-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 20px 32px;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    /* Desktop Left Sidebar (232px, profile strictly at bottom-left) */
    .pc-sidebar {
      width: 232px;
      background: #FAF9F5;
      border: 1px solid var(--border-strong);
      border-radius: 28px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 88px);
      max-height: 860px;
      position: sticky;
      top: 68px;
      box-shadow: 0 14px 34px rgba(6, 26, 46, 0.06);
    }

    .pc-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }

    .pc-brand-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--green-dark);
      letter-spacing: -0.02em;
    }

    .pc-brand-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .pc-nav-section-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 6px 10px 4px;
    }

    .pc-nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pc-nav-btn {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .pc-nav-btn:hover {
      background: var(--cream);
      color: var(--text-main);
    }

    .pc-nav-btn.on {
      background: var(--green-pri);
      color: #FFFFFF;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(19, 97, 74, 0.24);
    }

    .pc-nav-btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .pc-nav-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .pc-nav-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--red-bg);
      color: var(--red-txt);
    }

    .pc-nav-btn.on .pc-nav-badge {
      background: #FFFFFF;
      color: var(--green-dark);
    }

    /* Profile strictly at the bottom-left of the desktop sidebar */
    .pc-sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .pc-sidebar-profile {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .pc-profile-card {
      background: var(--cream);
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pc-profile-av {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--green-pri);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .pc-profile-meta {
      min-width: 0;
      flex: 1;
    }

    .pc-profile-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pc-profile-role {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================================
       MAIN APP STAGE (SLEEK GREEN HERO + WHITE ROUNDED SHEET)
       ========================================================================= */
    .app-stage {
      background: var(--green-pri);
      color: #FFFFFF;
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-elevated);
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 96px);
    }

    /* Top Header inside App Stage */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px 6px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* Hide duplicate logo in top header on desktop since pc-sidebar already shows it */
    .mobile-brand-mark {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .desktop-context-crumb {
      font-size: 13px;
      font-weight: 700;
      color: #D5ECE0;
      letter-spacing: 0;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      border-radius: 99px;
      padding: 8px 14px;
      min-height: 44px;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .chip-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .chip-btn.cta-light {
      background: #FFFFFF;
      color: var(--green-mid);
      border-color: #FFFFFF;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 99px;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      display: grid;
      place-items: center;
      position: relative;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .notif-dot {
      position: absolute;
      top: 9px;
      right: 10px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FDE8E6;
      border: 1.5px solid var(--green-pri);
    }

    /* Family Member / Budget Area Switcher Bar (.fam-bar) */
    .fam-bar-wrap {
      padding: 8px 24px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .fam-bar {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .fam-pill {
      min-height: 44px;
      padding: 6px 13px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.09);
      color: rgba(255, 255, 255, 0.92);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .fam-pill:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .fam-pill.on {
      background: #FFFFFF;
      color: var(--green-mid);
      border-color: #FFFFFF;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(6, 26, 46, 0.16);
    }

    .fam-pill.locked {
      background: rgba(6, 26, 46, 0.26);
      border-style: dashed;
      color: rgba(255, 255, 255, 0.78);
    }

    .fam-pill.locked.on {
      background: #FFF6E8;
      color: var(--amber-txt);
      border-color: var(--amber-txt);
      border-style: solid;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .fam-access-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.18);
    }

    .fam-pill.on .fam-access-tag {
      background: var(--mint-light);
      color: var(--green-dark);
    }

    /* Hero Section (Shown on Oversikt) */
    .hero {
      padding: 12px 24px 20px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 20px;
      align-items: end;
    }

    .hero-eyebrow-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-eyebrow {
      font-size: 13px;
      font-weight: 700;
      color: #C8E3CD;
    }

    .hero-delta-badge {
      background: rgba(156, 196, 163, 0.24);
      border: 1px solid var(--mint);
      color: var(--mint-light);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 99px;
    }

    .hero-main-numbers {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .hero-big-amount {
      font-size: clamp(38px, 4.5vw, 56px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.04;
    }

    .hero-big-amount .kr {
      font-size: 24px;
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    .hero-per-day {
      text-align: right;
      font-size: 12px;
      color: #D5ECE0;
    }

    .hero-per-day b {
      color: #FFFFFF;
      font-size: 15px;
    }

    /* Segmented Proportional Bar (.seg) */
    .seg {
      display: flex;
      gap: 4px;
      height: 36px;
      margin-top: 12px;
    }

    .seg > div {
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
    }

    .hat {
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      background: repeating-linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.52) 0 2px,
        transparent 2px 7px
      );
    }

    .seg-legend {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #D5ECE0;
    }

    /* Hero Pace Chart Card */
    .hero-chart-box {
      background: rgba(6, 26, 46, 0.24);
      border: 1px solid rgba(156, 196, 163, 0.28);
      border-radius: 16px;
      padding: 10px 14px;
      position: relative;
    }

    /* White Curved Sheet (.sheet) */
    .sheet {
      flex: 1;
      background: var(--surface);
      color: var(--text-main);
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      padding: 22px 24px 110px;
      min-height: 520px;
    }

    /* Bento Cards & Containers (.c) */
    .c {
      background: var(--cream);
      border-radius: var(--radius-card);
      padding: 16px;
      border: 1px solid var(--border);
    }

    .bento {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .l {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Semantic Status Badges (.s) */
    .s {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 99px;
      border: 1.5px solid;
      white-space: nowrap;
    }

    .act { background: var(--green-pri); color: #FFFFFF; border-color: var(--green-pri); }
    .exp { background: #FFFFFF; color: var(--green-pri); border: 1.5px dashed var(--green-pri); }
    .res { background: var(--mint-light); color: var(--green-mid); border-color: var(--mint); }
    .ovd { background: var(--red-bg); color: var(--red-txt); border-color: var(--red-txt); }
    .unk { background: #FFFFFF; color: var(--text-muted); border: 1.5px dotted var(--text-muted); }
    .wait { background: var(--amber-bg); color: var(--amber-txt); border-color: var(--amber-txt); }

    /* Filter Pills (.pills / .pill) */
    .pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      min-height: 44px;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      background: var(--cream);
      color: var(--text-muted);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .pill:hover {
      border-color: var(--green-pri);
      color: var(--text-main);
    }

    .pill.on {
      background: var(--green-pri);
      color: #FFFFFF;
      border-color: var(--green-pri);
    }

    /* Action Buttons inside White Sheet */
    .btn-pri {
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 99px;
      background: var(--green-pri);
      color: #FFFFFF;
      border: none;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-pri:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-sec {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 99px;
      background: #FFFFFF;
      color: var(--green-mid);
      border: 1.5px solid var(--border-strong);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-sec:hover:not(:disabled) {
      border-color: var(--green-pri);
      background: var(--mint-light);
    }

    .btn-sec:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Rows, Avatars & Progress Bars */
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .row:last-child {
      border-bottom: none;
    }

    .av {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .bar {
      height: 7px;
      border-radius: 99px;
      background: #E2E0D6;
      margin-top: 6px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: 99px;
    }

    /* Two-column desktop split inside sheet */
    .sheet-split {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 18px;
      margin-top: 18px;
      align-items: start;
    }

    /* Grounded Grouped Menu List for Mer (No floating pill clouds) */
    .mer-groups {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      place-items: center;
      font-size: 18px;
      flex-shrink: 0;

    .mer-row-body {
      min-width: 0;
      flex: 1;
    }

    .mer-row-body b {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
    }

    .mer-row-body span {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .mer-row-end {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

      font-size: 20px;
      font-weight: 700;

        gap: 14px;
      }

      padding: 12px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;

      color: var(--amber-txt);
      border: 1.5px solid #E9C46A;

      background: var(--mint-light);
      color: var(--green-dark);
      border: 1.5px solid var(--mint);
    }

    .access-banner.offline-warn {
      background: var(--red-bg);
      color: var(--red-txt);
      border: 1.5px solid var(--red-txt);
    }

    .dock-wrap {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 14px;
      height: 64px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid #DCD9CC;
      border-radius: 99px;
      padding: 6px 8px;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-dock);
      z-index: 45;
    }

    .dock-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 48px;
      min-width: 46px;
      padding: 0 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      border: none;
      background: transparent;
      transition: all 0.15s ease;

      background: var(--mint-light);
      color: var(--green-mid);
      font-weight: 800;
      padding: 0 14px;
    }

    .dock-item svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;

      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--green-pri);
      color: #FFFFFF;
      border: none;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(19, 97, 74, 0.4);
      flex-shrink: 0;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .dock-fab.open {
      background: var(--green-dark);
    }

    .dock-fab.open svg {
      transform: rotate(45deg);
    }

    .dock-speed-list {
      position: absolute;
      right: 4px;
      bottom: 72px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 50;
    }

    .dock-speed-item {
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 99px;
      background: #FFFFFF;
      color: var(--text-main);
      border: 1.5px solid var(--border-strong);
      box-shadow: 0 8px 22px rgba(6, 26, 46, 0.16);
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .dock-speed-item:hover:not(:disabled) {
      background: var(--mint-light);
      border-color: var(--green-pri);
      color: var(--green-dark);
      transform: translateY(-1px);
    }

    .dock-speed-item:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .dock-fab:disabled {
      background: var(--text-muted);
      opacity: 0.45;
      box-shadow: none;
    }

    /* Modal Backdrop & Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 26, 46, 0.56);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 120;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      color: var(--text-main);
      border-radius: 28px;
      padding: 24px 22px;
      box-shadow: 0 28px 64px rgba(6, 26, 46, 0.28);

      min-height: 44px;
      padding: 10px 14px;
      border-radius: 12px;

      background: var(--cream);
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;

    .cal-grid {
      display: grid;

      margin-top: 10px;

      font-weight: 700;

    /* =========================================================================
       MODE & ACCESS HELPERS
       ========================================================================= */
    function getViewer() {
      return viewerProfiles[state.viewerRole];
    }

    function getCurrentAreaAccess() {
      const viewer = getViewer();
      return viewer.areaAccess[state.area] || { mode: 'none', badge: '🔒 Låst', reason: 'Ingen tilgang.' };
    }

    function canWriteCurrentArea() {
      if (state.previewState === 'offline') return false;
      return getCurrentAreaAccess().mode === 'write';
    }

    function setViewerRole(roleId) {
      state.viewerRole = roleId;
      const viewer = getViewer();
      state.area = viewer.defaultArea;
      if (roleId === 'sander_restricted') {
        state.tab = 'restricted_home';
      } else if (state.tab === 'restricted_home') {
        state.tab = 'oversikt';
      }
      render();
    }

    function setPreviewState(st) {
      state.previewState = st;
      document.getElementById(' stateSelect'?.trim() || 'stateSelect').value = st;
      const loader = document.getElementById('fbLoader');
      if (st === 'loader') {
        loader.classList.add('active');
      } else {
        loader.classList.remove('active');
      }
      render();
    }

    function setLayoutMode(mode) {
      state.layoutMode = mode;
      document.body.classList.toggle('mode-phone', mode === 'phone');
      render();
    }

    function selectTab(tabId, subMod) {
      const viewer = getViewer();
      if (!viewer.allowedModules.includes(tabId)) {
        state.tab = 'restricted_home';
      } else {
        state.tab = tabId;
        state.subModule = subMod || null;
      }
      render();
    }

    function toggleHeroMode() {
      state.heroMode = state.heroMode === 'bar' ? 'chart' : 'bar';
      render();
    }

      const allDay = Boolean(document.getElementById('calAllDay')?.checked);

      const endTime = document.getElementById('calEndTime')?.value || '19:00';
      const time = allDay ? 'Hele dagen' : `${startTime}–${endTime}`;
      const scope = document.getElementById('calScope')?.value || 'felles';
      const recurrence = document.getElementById('calRecurrence')?.value || 'Engangsavtale';
      const pushSent = Boolean(document.getElementById('calPush')?.checked);
      const ownerMap = { felles: 'Felles', marte: 'Marte', jonas: 'Jonas', sander: 'Sander' };
      calendarEvents.unshift({
        id: Date.now(),
        day,
        time,
        title,
        scope,
        owner: ownerMap[scope] || 'Felles',
        rsvpMarte: 'Passer',
        rsvpJonas: 'Venter svar',
        rsvpSander: 'Venter svar',
        recurrence,
        pushSent
      });
      state.calSelectedDay = day;
      closeModal();
      render();
    }

      `;
    }

    /* =========================================================================
       RENDER FLOATING GLASSMORPHIC MOBILE BOTTOM DOCK (.dock-wrap)
       ========================================================================= */
    function renderBottomDock() {
      const dockEl = document.getElementById('bottomDock');
      const isRestricted = state.viewerRole === 'sander_restricted';
      const writable = canWriteCurrentArea();

      const navItems = isRestricted ? [
        { id: 'restricted_home', label: 'Startside', icon: '<path d="M3 11l9-8 9 8v9H3z"></path>' },
        { id: 'sparing',  label: 'Sparing',  icon: '<path d="M12 4a8 8 0 100 16 8 8 0 000-16zM12 8v8"></path>' },
        { id: 'kalender', label: 'Kalender', icon: '<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path>' }
      ] : [
        { id: 'oversikt', label: 'Oversikt', icon: '<path d="M3 11l9-8 9 8v9H3z"></path>' },
        { id: 'poster',   label: 'Poster',   icon: '<path d="M6 3h12v18H6zM9 8h6M9 12h6"></path>' },
        { id: 'budsjett', label: 'Budsjett', icon: '<path d="M5 20V11M12 20V4M19 20v-6"></path>' },
        { id: 'sparing',  label: 'Sparing',  icon: '<path d="M12 4a8 8 0 100 16 8 8 0 000-16zM12 8v8"></path>' },
        { id: 'kalender', label: 'Kalender', icon: '<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path>' },
        { id: 'mer',      label: 'Mer',      icon: '<path d="M4 6h16M4 12h16M4 18h16"></path>' }
      ];

      dockEl.innerHTML = navItems.map(n => `
        <button class="dock-item ${state.tab === n.id ? 'on' : ''}" onclick="state.mobileFabOpen=false;selectTab('${n.id}')" title="${n.label}" aria-label="${n.label}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${n.icon}</svg>
          ${state.tab === n.id ? `<span>${n.label}</span>` : ''}
        </button>
      `).join('') + (!isRestricted ? `
        ${state.mobileFabOpen ? `
          <div class="dock-speed-list" role="menu" aria-label="Hurtigvalg">
            <button class="dock-speed-item" role="menuitem" ${writable ? '' : 'disabled'} onclick="state.mobileFabOpen=false;renderBottomDock();openQuickAddModal('manual','act')">
              <span>🧾</span><span>Utgift / ny post</span>
            </button>
            <button class="dock-speed-item" role="menuitem" ${writable ? '' : 'disabled'} onclick="state.mobileFabOpen=false;renderBottomDock();openQuickAddModal('manual','res')">
              <span>📅</span><span>Regning</span>
            </button>
            <button class="dock-speed-item" role="menuitem" onclick="state.mobileFabOpen=false;selectTab('handlelister')">
              <span>🛒</span><span>Handleliste</span>
            </button>
          </div>
        ` : ''}
        <button class="dock-fab ${state.mobileFabOpen ? 'open' : ''}" aria-expanded="${state.mobileFabOpen ? 'true' : 'false'}" onclick="toggleMobileQuickMenu(event)" aria-label="Hurtigvalg: utgift, regning eller handleliste" title="Hurtigvalg: utgift, regning eller handleliste">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
      ` : '');
    }

    function render() {
      renderPcSidebar();
      renderHeaderAndMemberBar();
      renderHero();
      renderSheet();
      renderBottomDock();
    }

    render();
  </script>
</body>
</html>
