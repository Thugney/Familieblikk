name: familieblikk
services:
  db:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familieblikk}
      POSTGRES_USER: ${POSTGRES_USER:-familieblikk_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sett eierpassord utenfor Git}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    image: familieblikk:local
    restart: 'no'
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Sett Django-hemmelighet}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-familieblikk}
      POSTGRES_USER: ${POSTGRES_USER:-familieblikk_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sett eierpassord}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-familieblikk_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Sett separat apppassord}
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: [sh, -c, 'python manage.py migrate --noinput && python manage.py setup_runtime_role']
  app:
    build: .
    image: familieblikk:local
    restart: unless-stopped
    # Bare eksplisitte runtime-verdier. Eierpassord finnes aldri i appcontaineren.
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Sett Django-hemmelighet}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_PREREGISTERED_LOGIN: ${DJANGO_PREREGISTERED_LOGIN:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-0}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-familieblikk}
      POSTGRES_USER: ${POSTGRES_APP_USER:-familieblikk_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Sett separat apppassord}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      PRIVATE_IMPORT_ROOT: /private-import
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    networks: [database, web]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: [gunicorn, familieblikk.wsgi:application, --bind, '0.0.0.0:8000', --workers, '2', --no-control-socket, --access-logfile, '-', --access-logformat, '%(s)s %(L)s']
networks:
  database:
    internal: true
  web: {}
volumes:
  database: {}
