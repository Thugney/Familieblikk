name: familieblikk
services:
  db:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familieblikk}
      POSTGRES_USER: ${POSTGRES_USER:-familieblikk_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sett eierpassord utenfor Git}
      PGPORT: ${POSTGRES_PORT:-6452}
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/familieblikk/pg_hba.conf:ro
    # Host-nettverk deler vertens porter. PostgreSQL skal bare lytte på localhost.
    command: [postgres, -c, 'listen_addresses=127.0.0.1', -c, 'hba_file=/etc/familieblikk/pg_hba.conf', -c, 'password_encryption=scram-sha-256', -p, '${POSTGRES_PORT:-6452}']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    image: familieblikk:local
    restart: 'no'
    network_mode: host
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Sett Django-hemmelighet}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-6452}
      POSTGRES_DB: ${POSTGRES_DB:-familieblikk}
      POSTGRES_USER: ${POSTGRES_USER:-familieblikk_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sett eierpassord}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-familieblikk_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Sett separat apppassord}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: [sh, -c, 'python manage.py migrate --noinput && python manage.py setup_push && python manage.py setup_runtime_role']
  push-worker:
    build: .
    image: familieblikk:local
    restart: unless-stopped
    network_mode: host
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Sett Django-hemmelighet}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-6452}
      POSTGRES_DB: ${POSTGRES_DB:-familieblikk}
      POSTGRES_USER: ${POSTGRES_APP_USER:-familieblikk_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Sett separat apppassord}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 20s
    command: [python, manage.py, push_worker]
  document-worker:
    build: .
    image: familieblikk:local
    restart: unless-stopped
    network_mode: host
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Sett Django-hemmelighet}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-6452}
      POSTGRES_DB: ${POSTGRES_DB:-familieblikk}
      POSTGRES_USER: ${POSTGRES_APP_USER:-familieblikk_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Sett separat apppassord}
      PRIVATE_DOCUMENT_ROOT: /private-documents
      PRIVATE_SCAN_ROOT: /private-scans
    volumes:
      - documents:/private-documents:ro
      - scan-spool:/private-scans
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 20s
    command: [python, manage.py, document_worker]
  app:
    build: .
    image: familieblikk:local
    restart: unless-stopped
    network_mode: host
    # Bare eksplisitte runtime-verdier. Eierpassord finnes aldri i appcontaineren.
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Sett Django-hemmelighet}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_PREREGISTERED_LOGIN: ${DJANGO_PREREGISTERED_LOGIN:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-blikk.betilab.com}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-1}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://blikk.betilab.com}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-6452}
      POSTGRES_DB: ${POSTGRES_DB:-familieblikk}
      POSTGRES_USER: ${POSTGRES_APP_USER:-familieblikk_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Sett separat apppassord}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      PRIVATE_IMPORT_ROOT: /private-import
      PRIVATE_DOCUMENT_ROOT: /private-documents
      PRIVATE_SCAN_ROOT: /private-scans
    volumes:
      - documents:/private-documents
      - scan-spool:/private-scans
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: [gunicorn, familieblikk.wsgi:application, --bind, '0.0.0.0:6451', --workers, '2', --no-control-socket, --access-logfile, '-', --access-logformat, '%(s)s %(L)s']
volumes:
  database: {}
  documents: {}
  scan-spool: {}
