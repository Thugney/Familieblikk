name: PostgreSQL og Django
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: familieblikk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: familieblikk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U familieblikk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-key-never-use-in-production
      POSTGRES_PASSWORD: ci-only-password
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing document runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-nor tesseract-ocr-eng poppler-utils
          python -c "import ctypes, ctypes.util; library = ctypes.util.find_library('leptonica') or ctypes.util.find_library('lept'); assert library, 'Leptonica image decoder is required'; ctypes.CDLL(library)"
          python - <<'PY'
          import base64, tempfile
          from pathlib import Path
          from budget.document_image_probe import main
          with tempfile.TemporaryDirectory() as directory:
              image = Path(directory) / 'probe.png'
              image.write_bytes(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4//8/AAX+Av4N70a4AAAAAElFTkSuQmCC'))
              assert main(str(image)) == 0, 'Native decoding of a valid PNG failed'
          PY
      - run: node --test tests/ui-refresh-behavior.test.cjs budget/tests/financial-area.test.cjs budget/tests/camera-scan.test.cjs budget/tests/shopping-refresh.test.cjs budget/tests/document-draft.test.cjs budget/tests/sw.test.cjs budget/tests/category-search.test.cjs budget/tests/calendar-draft.test.cjs tests/spending-behavior.test.cjs tests/host-network.test.cjs tests/push-behavior.test.cjs tests/loader-behavior.test.cjs
      - run: pip install --require-hashes -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test budget --verbosity 2
