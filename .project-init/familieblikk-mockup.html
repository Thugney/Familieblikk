<body>
<div class="preview"><strong>DESIGNFORSLAG · Fiktive familiedata · Ingenting lagres</strong><span class="spacer"></span><label for="preview-screen">Skjerm</label><select id="preview-screen" aria-label="Velg skjerm for gjennomgang"></select><label for="preview-state">Tilstand</label><select id="preview-state"><option value="Default">Vanlig</option><option value="Empty">Tom</option><option value="Loading">Laster</option><option value="Offline">Uten nett</option><option value="Error">Feil</option><option value="Member">Medlemsvisning</option><option value="Negative">Negativt beløp</option></select></div>
<div class="shell"><aside><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Familieblikk</div><div class="family-tag"><span class="avatar">FN</span><div><strong>Familien Nordby</strong><br><small>Vårt felles budsjett</small></div></div><nav class="nav" aria-label="Hovedmeny" id="desktop-nav"></nav><div class="aside-foot"><div class="row"><span class="avatar">IN</span><div><strong>Ida Nordby</strong><br><small id="role-label">Administrator</small></div></div><p>En litt enklere økonomihverdag.</p></div></aside>
<div class="workspace"><header class="topbar"><span class="crumb">Familien Nordby</span><div class="top-actions"><label class="hidden" for="month">Måned</label><select id="month"><option>Oktober 2026</option><option>September 2026</option></select><button class="icon-btn" id="notifications" aria-label="Vis regningsvarsler"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i class="dot"></i></button><span class="avatar name">IN</span></div></header><main class="content" id="main" tabindex="-1"></main></div></div>
<nav class="bottom-nav" aria-label="Mobilmeny" id="mobile-nav"></nav><div class="toast hidden" id="toast" role="status"></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<script>
const icons={oversikt:'M3 10 12 3l9 7v11h-6v-7H9v7H3Z',poster:'M6 3h12v18l-3-2-3 2-3-2-3 2ZM9 8h6M9 12h6',budsjett:'M3 3v18h18M7 16v-5M12 16V7M17 16v-8',regninger:'M6 3h12v18H6ZM9 7h6M9 11h6M9 15h3',sparing:'M4 10h16v10H4ZM2 6h20v4H2ZM12 6v14M12 6C7 6 6 1 9 2c2 0 3 4 3 4Zm0 0c5 0 6-5 3-4-2 0-3 4-3 4Z',familie:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 3a4 4 0 0 1 0 8M22 21v-3a4 4 0 0 0-3-3',mer:'M4 6h16M4 12h16M4 18h16',plus:'M12 5v14M5 12h14',arrow:'M7 17 17 7M7 7h10v10',down:'M12 4v16M6 14l6 6 6-6'};
const icon=(key)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[key]||icons.oversikt}"/></svg>`;
const titles={oversikt:'Oversikt',poster:'Poster',budsjett:'Budsjett',regninger:'Regninger',sparing:'Sparing',familie:'Familie',mer:'Mer',innlogging:'Innlogging',opprett:'Opprett familie',invitasjon:'Godta invitasjon'};
const money=n=>new Intl.NumberFormat('nb-NO',{maximumFractionDigits:0}).format(n)+' kr';
let screen='oversikt',state='Default',filter='Alle',authStep='email';
const cats=[['Bolig',18000,22000,'#456EB1',4500],['Mat og dagligvarer',6450,10000,'#B27C2C',0],['Transport',2200,4500,'#8260A4',0],['Barn',1200,2500,'#B26074',1200],['Fritid',600,2000,'#508B79',0],['Annet',0,4000,'#6D7781',2950]];
const navButton=(key,mobile=false)=>`<button data-go="${key}" class="${screen===key||key==='mer'&&['familie','regninger','mer'].includes(screen)?'active':''}" ${screen===key?'aria-current="page"':''}>${icon(key)}<span>${titles[key]}</span></button>`;
const head=(title,sub,action,label)=>`<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${action?`<button class="primary" data-action="${action}">${icon('plus')} ${label}</button>`:''}</div>`;
function categoryRows(all=false){return cats.slice(0,all?6:4).map(c=>`<div class="category"><div class="cat-top"><span class="cat-label"><i class="swatch" style="background:${c[3]}"></i>${c[0]}</span><span class="num"><strong>${money(c[1])}</strong> <span class="muted">/ ${money(c[2])}</span></span></div><div class="bar" role="img" aria-label="${c[0]}: ${money(c[1])} brukt av ${money(c[2])}"><i style="width:${100*c[1]/c[2]}%;background:${c[3]}"></i></div>${all?`<small>${money(c[2]-c[1])} før ubetalte regninger · ${money(c[4])} i regninger reservert</small>`:''}</div>`).join('')}
function bills(pay=false){return [['05','Forsikring','Forfalt · 5. oktober',2950,'Annet'],['22','Felleskostnader','22. oktober',4500,'Bolig'],['24','Barnehage','24. oktober',1200,'Barn']].map((b,i)=>`<div class="bill"><div class="date-box">${b[0]}<span>okt</span></div><div class="bill-text"><p>${b[1]}</p><small ${i===0?'style="color:var(--red)"':''}>${b[2]}${pay?' · '+b[4]:''}</small></div><div class="bill-amount num">${money(b[3])}${!pay?'<small>Ubetalt</small>':''}</div>${pay?`<button data-action="pay" data-bill="${b[1]}" data-amount="${b[3]}">Marker betalt</button>`:''}</div>`).join('')}
function goals(full=false){return [['Buffer',32500,50000,4000,4500],['Sommerferie',18000,40000,2000,0]].map((g,i)=>full?`<article class="card"><div class="row"><h2>${g[0]}</h2><span class="chip">${Math.round(g[1]/g[2]*100)} %</span></div><p class="goal-big num">${money(g[1])}</p><p class="muted">av ${money(g[2])}</p><div class="bar mt"><i style="width:${g[1]/g[2]*100}%;${i?'background:var(--blue)':''}"></i></div><div class="math mt"><div class="row"><span>Månedlig spareplan</span><strong>${money(g[3])}</strong></div><div class="row"><span>Innskudd i oktober</span><strong>${money(g[4])}</strong></div><div class="row"><span>Reservert denne måneden</span><strong>${money(Math.max(g[3],g[4]))}</strong></div></div><p class="subtle">${i?'Planen er reservert selv om innskudd ikke er registrert.':'Inkluderer 500 kr i ekstra innskudd denne måneden.'}</p><div class="row mt"><button class="primary" data-action="deposit" data-goal="${g[0]}">Registrer innskudd</button><button class="link" data-action="goal-edit">Endre mål</button></div></article>`:`<div class="savings-row"><div class="cat-top"><strong>${g[0]}</strong><span class="num">${money(g[1])} <span class="muted">/ ${money(g[2])}</span></span></div><div class="bar"><i style="width:${g[1]/g[2]*100}%;${i?'background:var(--blue)':''}"></i></div><p>${Math.round(g[1]/g[2]*100)} % av målet · ${money(g[3])} planlagt per måned</p></div>`).join('')}
function dashboard(){const negative=state==='Negative';return head('God oversikt. Litt mer ro.','Her er familiens økonomi i oktober.','expense','Ny post')+`<div class="hero-grid"><section class="hero" aria-label="Igjen å bruke"><div class="hero-icon">${icon('arrow')}</div><div class="eyebrow">Igjen å bruke i oktober</div><div class="amount num">${negative?'−2 400':'18 400'} <span>kr</span></div><p>${negative?'Registrerte inntekter dekker ikke alle avsetninger.':'Regninger og planlagt sparing er allerede satt av.'}</p><div class="hero-foot"><span>Oppdatert i dag kl. 09.41 · Demo</span><button data-action="calculation">Se beregningen ↗</button></div></section><section class="card daily"><div class="eyebrow">Veiledende dagsbeløp</div><div class="amount num">${negative?'−200':'1 533'} <span>kr / dag</span></div><small>12 dager igjen, inkludert i dag</small><div class="note">${negative?'Underskudd: juster utgifter eller avsetninger.':'En veiledende budsjettfordeling, ikke bankbeholdning.'}</div></section></div><div class="mini-grid"><section class="card mini"><div class="round">${icon('down')}</div><div><p class="label">Mottatt inntekt</p><p class="value num">62 000 kr</p><small>Forventet i tillegg: 12 000 kr</small></div></section><section class="card mini"><div class="round blue">${icon('poster')}</div><div><p class="label">Betalte utgifter</p><p class="value num">28 450 kr</p><small>Denne måneden</small></div></section><section class="card mini"><div class="round gold">${icon('sparing')}</div><div><p class="label">Spareinnskudd</p><p class="value num">4 500 kr</p><small>Plan: 6 000 kr</small></div></section></div><div class="two-col"><section class="card"><div class="card-head"><div><h2>Hvor går pengene?</h2><p>Betalt forbruk mot månedsgrense</p></div><button class="link" data-go="budsjett">Alle kategorier ↗</button></div>${categoryRows()}<p class="subtle">Ubetalte regninger vises separat i budsjettet.</p></section><section class="card"><div class="card-head"><div><h2>Kommende regninger</h2><p><span class="alert-dot"></span>8 650 kr reservert · 1 forfalt</p></div><button class="link" data-go="regninger">Se alle ↗</button></div>${bills()}</section></div><div class="two-col"><section class="card"><div class="card-head"><div><h2>Mer rom i hverdagen</h2><p>Betalte utgifter, 1.–20. i hver måned</p></div><span class="chip">↓ 7,3 %</span></div><div class="chart" role="img" aria-label="1. til 20. august: 32 800 kr. September: 30 700 kr. Oktober: 28 450 kr."><div class="chart-col"><span>32 800 kr</span><div class="chart-bar" style="height:103px"></div></div><div class="chart-col"><span>30 700 kr</span><div class="chart-bar" style="height:96px"></div></div><div class="chart-col"><span>28 450 kr</span><div class="chart-bar current" style="height:89px"></div></div></div><div class="chart-labels"><span>August</span><span>September</span><span>Oktober</span></div><p class="subtle">2 250 kr mindre enn samme periode i september.</p></section><section class="card"><div class="card-head"><div><h2>Små steg. Felles mål.</h2><p>Sparingen følger dere fra måned til måned</p></div><button class="link" data-go="sparing">Se mål ↗</button></div>${goals()}</section></div>`}
const entries=[['20. okt.','Mat og dagligvarer','Mat','Ida',-845],['19. okt.','Månedslønn','Inntekt','Jonas',30000],['18. okt.','Kollektivkort','Transport','Jonas',900],['17. okt.','Mat og dagligvarer','Mat','Ida',-655],['16. okt.','Månedslønn','Inntekt','Ida',32000]];
function posts(){const rows=entries.filter(e=>filter==='Alle'||(filter==='Inntekter'?e[2]==='Inntekt':e[2]!=='Inntekt'));return head('Familiens poster','Alle kan se. Du endrer dine egne.','expense','Ny post')+`<div class="filters">${['Alle','Utgifter','Inntekter'].map(x=>`<button data-filter="${x}" class="${filter===x?'selected':''}" aria-pressed="${filter===x}">${x}</button>`).join('')}</div><section class="card"><div class="card-head"><h2>Siste registreringer</h2><span class="chip">Oktober</span></div><div class="table-wrap"><table><thead><tr><th>Dato</th><th>Beskrivelse</th><th>Kategori</th><th>Registrert av</th><th>Beløp</th><th>Handling</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${e[0]}</td><td><strong>${e[1]}</strong></td><td>${e[2]}</td><td>${e[3]}</td><td class="num ${e[2]==='Inntekt'?'positive':''}">${e[2]==='Inntekt'?'+':'−'}${money(Math.abs(e[4]))}</td><td>${state!=='Member'||e[3]==='Ida'?'<button class="link" data-action="edit">Endre</button>':'<small>Kun eier / admin</small>'}</td></tr>`).join('')}</tbody></table></div><p class="subtle">Viser de fem siste postene, ikke hele månedens summer.</p></section><section class="card mt"><div class="card-head"><h2>Forventet inntekt</h2><span class="chip warning">Ikke mottatt</span></div><div class="row"><div><strong>Jonas · Ekstra inntekt</strong><p class="muted">Forventet 28. oktober · Inngår ikke i «igjen å bruke»</p></div><strong class="num">12 000 kr</strong></div><button class="link mt" data-action="receive" ${state==='Member'?'disabled':''}>Marker som mottatt</button>${state==='Member'?'<small>Bare Jonas eller administratoren kan endre denne inntekten.</small>':''}</section>`}
function budget(){return head('Et budsjett vi deler','Felles grenser. Ny start hver måned.',state==='Member'?null:'budget-edit','Endre grenser')+`${state==='Member'?'<div class="notice">Du kan se budsjettet. Administratoren endrer kategorier og grenser.</div>':''}<div class="mini-grid"><section class="card"><small>Månedsgrenser totalt</small><h2 class="num mt">45 000 kr</h2></section><section class="card"><small>Betalte utgifter</small><h2 class="num mt">28 450 kr</h2></section><section class="card"><small>Ubetalte regninger</small><h2 class="num mt">8 650 kr</h2></section></div><div class="two-col"><section class="card"><div class="card-head"><h2>Kategoriene våre</h2><span class="chip">Oktober</span></div>${categoryRows(true)}</section><section class="card"><h2>Én grense, hele familien</h2><p class="muted mt">Månedsgrensene videreføres automatisk. Forbruk starter på null. Sparemål og ubetalte regninger følger med videre.</p><div class="notice warning mt"><strong>Bolig trenger et blikk</strong><p>18 000 kr betalt + 4 500 kr ubetalt = 22 500 kr. Det er 500 kr over grensen.</p></div><p class="subtle">Kategoriens grense reserverer ikke penger en gang til i «igjen å bruke».</p><button class="link mt" data-action="category">${state==='Member'?'Se kategoridetaljer':'Administrer kategorier'} ↗</button></section></div>`}
function billScreen(){return head('Regningene er med i planen','Ubetalte regninger er allerede satt av.','bill-new','Ny regning')+`<div class="notice warning"><strong>1 regning er forfalt.</strong> Forsikring på 2 950 kr venter på å bli markert betalt.</div><section class="card"><div class="card-head"><h2>Ubetalte · oktober</h2><strong class="num">8 650 kr</strong></div>${bills(true)}<p class="subtle">«Marker betalt» registrerer en utgift. Familieblikk gjennomfører ingen bankbetaling.</p></section><section class="card mt"><h2>Faste regninger</h2><p class="muted mt">Felleskostnader, forsikring og barnehage gjentas månedlig. Endringer i en fast regning gjelder fremtidige forekomster.</p><button class="link" data-action="templates">Se og administrer faste regninger ↗</button></section>`}
function savingScreen(){return head('Det vi sparer til','Fremdriften blir med inn i neste måned.','goal-new','Nytt sparemål')+`<div class="grid-cards">${goals(true)}</div><section class="card mt"><h2>Slik påvirker sparing budsjettet</h2><p class="muted mt">6 000 kr planlagt + 500 kr utover planen = 6 500 kr satt av. De registrerte innskuddene trekkes ikke fra på nytt.</p><button class="link" data-action="calculation">Se hele beregningen ↗</button></section>`}
function family(){return head('Familien vår','Ett felles budsjett. Hver sin innlogging.',state==='Member'?null:'invite','Inviter medlem')+`<section class="card"><div class="card-head"><h2>Familien Nordby</h2><span class="chip">2 medlemmer</span></div>${[['Ida Nordby','ida@example.test','Administrator','IN'],['Jonas Nordby','jonas@example.test','Medlem','JN']].map(m=>`<div class="bill"><span class="avatar">${m[3]}</span><div class="bill-text"><p>${m[0]}</p><small>${m[1]}</small></div><span class="chip">${m[2]}</span></div>`).join('')}<p class="subtle">Familiens budsjett er privat. Andre familier har ikke tilgang.</p></section><div class="grid-cards mt"><section class="card"><h2>Innstillinger</h2><div class="math mt"><div class="row"><span>Språk</span><strong>Norsk bokmål</strong></div><div class="row"><span>Valuta</span><strong>NOK</strong></div><div class="row"><span>Månedsskifte</span><strong>Ny start</strong></div></div></section><section class="card"><h2>Din tilgang</h2><p class="muted mt">${state==='Member'?'Du kan se familiens poster og endre dine egne. Administratoren styrer invitasjoner og budsjettgrenser.':'Som administrator kan du endre familiens poster, invitere medlemmer og administrere budsjettet.'}</p><button class="link" data-go="innlogging">Logg ut av forhåndsvisningen</button></section></div>`}
function auth(){return `<section class="auth"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Familieblikk</div><h1>${authStep==='email'?'Litt mer oversikt. Sammen.':'Skriv inn engangskoden'}</h1><p>${authStep==='email'?'Logg inn eller kom i gang med familiens felles budsjett.':'Vi viser neste steg med en fiktiv kode. Ingen e-post er sendt.'}</p><form id="auth-form" class="form-grid">${authStep==='email'?'<div><label for="email">E-postadresse</label><input id="email" type="email" autocomplete="email" placeholder="deg@eksempel.no" required></div><button class="primary" type="submit">Send engangskode</button>':'<div><label for="code">Engangskode</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 sifre" required></div><button class="primary" type="submit">Fortsett</button>'}</form><p class="subtle">${authStep==='email'?'Du trenger ikke passord.':'Koden er gyldig i 10 minutter. Ny kode etter 60 sekunder.'}</p></section>`}
function createFamily(){return `<section class="auth"><span class="chip">Velkommen til Familieblikk</span><h1 class="mt">Gi familien et navn</h1><p>Opprett familiens private budsjett. Du blir administrator og kan invitere de andre.</p><form id="family-form" class="form-grid"><div><label for="family-name">Familienavn</label><input id="family-name" required maxlength="80" placeholder="Familien Nordby"></div><button class="primary">Opprett familie</button></form><p class="subtle">Har du en invitasjon? Åpne lenken du har fått på e-post.</p></section>`}
function invitation(){return `<section class="auth"><span class="chip">Invitasjon</span><h1 class="mt">Bli med i Familien Nordby</h1><p>Ida har invitert deg til familiens felles budsjett som medlem.</p><div class="notice">Invitasjonen gjelder <strong>jonas@example.test</strong>. Bekreft denne adressen med en engangskode.</div><button class="primary" data-action="join">Bekreft adresse og bli med</button><p class="subtle">Du kan være med i én familie. En utløpt invitasjon krever ny lenke fra administratoren.</p></section>`}
function more(){return head('Mer for familien','Regninger, familie og innstillinger.')+`<div class="menu-list">${['regninger','familie'].map(k=>`<button data-go="${k}"><span>${icon(k)} &nbsp; ${titles[k]}</span><span aria-hidden="true">↗</span></button>`).join('')}<button data-action="install"><span>Legg til på hjemskjermen</span><span aria-hidden="true">↗</span></button></div>`}
function render(){document.documentElement.dataset.screen=screen;document.documentElement.dataset.state=state;document.getElementById('preview-screen').value=screen;document.getElementById('preview-state').value=state;document.getElementById('desktop-nav').innerHTML=['oversikt','poster','budsjett','regninger','sparing','familie','mer'].map(k=>navButton(k)).join('');document.getElementById('mobile-nav').innerHTML=['oversikt','poster','budsjett','sparing','mer'].map(k=>navButton(k,true)).join('');document.getElementById('role-label').textContent=state==='Member'?'Medlem':'Administrator';const body={oversikt:dashboard,poster:posts,budsjett:budget,regninger:billScreen,sparing:savingScreen,familie:family,mer:more,innlogging:auth,opprett:createFamily,invitasjon:invitation,...(window.optionalScreens||{}),...(window.optionalScreens||{}),...(window.optionalScreens||{}),...(window.optionalScreens||{}),...(window.optionalScreens||{}),...(window.optionalScreens||{})}[screen]();let content=body;if(state==='Empty')content=head(titles[screen],'Vi tar det ett steg av gangen.')+`<section class="card empty"><h2>${screen==='oversikt'?'Her starter familiens oversikt':'Ingen registreringer ennå'}</h2><p>Registrer inntekt, sett budsjettgrenser og legg til familiens første utgift.</p><button class="primary" data-action="expense">Registrer første post</button></section>`;if(state==='Loading')content=head(titles[screen],'Henter familiens oversikt …')+'<div role="status" aria-label="Laster"><div class="skeleton"></div><div class="skeleton"></div></div>';if(state==='Error')content=head(titles[screen],'Vi fikk ikke hentet opplysningene.')+'<div class="notice error" role="alert">Noe gikk galt. Prøv igjen. Ingen endringer er lagret.</div><button data-action="retry">Prøv igjen</button>';if(state==='Offline')content=head(titles[screen],'Du er uten nett.')+'<section class="card empty"><h2>Koble til for å se budsjettet</h2><p>Familiens opplysninger lagres ikke for bruk uten nett. Du kan fortsette når forbindelsen er tilbake.</p><button data-action="retry">Prøv igjen</button></section>';document.getElementById('main').innerHTML=content+'<p class="footer-note">Familieblikk · Designforslag · Fiktive beløp per 20. oktober 2026</p>';}
function go(k){screen=k;render();document.getElementById('main').focus({preventScroll:true});window.scrollTo(0,0)}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),5500)}
function dialog(title,body,footer=''){const d=document.getElementById('dialog');d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button data-close aria-label="Lukk dialog">✕</button></div>${body}${footer}`;d.showModal()}
function formDialog(type,title,extra=''){dialog(title,`<p>Forhåndsvisning av registrering. Ingenting lagres.</p><form id="demo-form" class="form-grid"><div><label for="description">${type==='invite'?'E-postadresse':'Beskrivelse'}</label><input id="description" ${type==='invite'?'type="email"':'type="text"'} required maxlength="140" value="${extra}"></div>${type==='invite'?'':`<div><label for="amount">Beløp i kroner</label><input id="amount" type="number" min="0.01" step="0.01" required placeholder="0,00"></div><div><label for="entry-date">Dato</label><input id="entry-date" type="date" value="2026-10-20" required></div>${type==='expense'?'<div><label for="type">Type</label><select id="type"><option>Utgift</option><option>Mottatt inntekt</option><option>Forventet inntekt</option></select></div><div><label for="category">Kategori</label><select id="category">'+cats.map(c=>'<option>'+c[0]+'</option>').join('')+'</select></div>':''}` }<div class="dialog-foot"><button type="button" data-close>Avbryt</button><button class="primary">Forhåndsvis registrering</button></div></form>`)}
document.getElementById('preview-screen').innerHTML=Object.entries(titles).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
document.getElementById('preview-screen').addEventListener('change',e=>go(e.target.value));document.getElementById('preview-state').addEventListener('change',e=>{state=e.target.value;render()});document.getElementById('month').addEventListener('change',e=>{if(e.target.selectedIndex===1){dialog('September · historisk måned','<p>Tidligere overskudd vises i historikken og overføres ikke til oktober. Dagsbeløp vises ikke for avsluttede måneder.</p><div class="math"><div class="row"><span>Mottatt inntekt</span><strong>62 000 kr</strong></div><div class="row"><span>Betalte utgifter</span><strong>40 000 kr</strong></div><div class="row"><span>Faktiske spareinnskudd</span><strong>6 000 kr</strong></div><div class="row total"><span>Kontantresultat</span><strong>16 000 kr</strong></div></div><p class="subtle">Historisk eksempel · ikke overført til oktober.</p>');e.target.selectedIndex=0}});
document.getElementById('notifications').addEventListener('click',()=>go('regninger'));
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){document.getElementById('dialog').close();return}const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;if(action==='calculation')dialog('Slik beregnes «igjen å bruke»',`<div class="math"><div class="row"><span>Mottatt inntekt</span><strong>62 000 kr</strong></div><div class="row"><span>Betalte utgifter</span><strong>−28 450 kr</strong></div><div class="row"><span>Ubetalte regninger</span><strong>−8 650 kr</strong></div><div class="row"><span>Satt av til sparing</span><strong>−6 500 kr</strong></div><div class="row total"><span>Igjen å bruke</span><strong>18 400 kr</strong></div></div><p class="subtle">Sparing: Buffer max(4 000 plan, 4 500 innskudd) + Sommerferie max(2 000 plan, 0 innskudd). Forventet inntekt er ikke med. Tidligere overskudd er ikke med.</p><p class="subtle">Dagsbeløp: 18 400 / 12 = 1 533,33 kr. Kortet viser hele kroner. Beregningsforslag til godkjenning.</p>`);else if(action==='expense'||action==='edit')formDialog('expense',action==='edit'?'Endre egen post':'Registrer en post');else if(action==='pay')dialog('Marker regning som betalt',`<p><strong>${a.dataset.bill} · ${money(Number(a.dataset.amount))}</strong></p><p>Regningen blir en utgift med dagens betalingsdato. Det reserverte beløpet erstattes, slik at pengene bare trekkes fra én gang.</p><div class="dialog-foot"><button data-close>Avbryt</button><button class="primary" data-action="demo-confirm">Bekreft betaling</button></div>`);else if(action==='demo-confirm'){document.getElementById('dialog').close();toast('Forhåndsvisning: her bekreftes betalingen. Ingen utgift er lagret.')}else if(action==='deposit')formDialog('deposit','Registrer spareinnskudd',a.dataset.goal);else if(action==='invite')formDialog('invite','Inviter familiemedlem');else if(action==='retry'){state='Default';render()}else if(action==='join'){authStep='email';go('innlogging');toast('Bekreft invitasjonens e-postadresse. Dette er kun en forhåndsvisning.')}else if(action==='install')dialog('Legg Familieblikk til på hjemskjermen','<p>I den ferdige appen kan du velge «Legg til på Hjem-skjerm» i Safari eller installasjonsvalget i støttede nettlesere. Designforslaget er ikke en installert PWA.</p>');else{const info={'receive':['Marker inntekt som mottatt','Forventet inntekt blir aktiv i måneden den mottas. Den samme posten oppdateres; inntekten legges ikke til to ganger.'], 'budget-edit':['Endre månedsgrenser','Administratorens skjema viser kategorier med én felles kronegrense per måned. Endringer i oktober påvirker ikke tidligere måneder.'],category:['Familiens kategorier','Administrator kan endre navn, legge til og arkivere kategorier. Historiske poster beholder kategorikoblingen.'],templates:['Faste regninger','Rediger beskrivelse, beløp, kategori, forfallsdag og månedlig gjentakelse. Endring gjelder kommende regninger.'], 'bill-new':['Ny fast regning','Registrer beskrivelse, beløp, kategori og forfallsdag. Forslag for v1: månedlig gjentakelse.'], 'goal-new':['Nytt sparemål','Registrer navn, målbeløp og fast månedlig sparebeløp. Sparing registreres først når noen legger inn et faktisk innskudd.'], 'goal-edit':['Endre sparemål','Endre navn, målbeløp og neste måneds spareplan. Behold allerede registrert fremdrift.']}[action];if(info)dialog(info[0],`<p>${info[1]}</p><p class="subtle">Detaljskjema er spesifisert i UX-dokumentet; denne visningen viser informasjonsflyten.</p>`)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='auth-form'){if(authStep==='email'){authStep='code';render();document.getElementById('code').focus()}else go('opprett')}else if(e.target.id==='family-form'){go('oversikt');toast('Forhåndsvisning av familiens startside. Ingen familie er opprettet.')}else if(e.target.id==='demo-form'){document.getElementById('dialog').close();toast('Registreringen er vist. Ingen opplysninger er lagret i designforslaget.')}});
function applyPreview(){const p=new URLSearchParams(location.search);const requested=p.get('screen');if(requested&&titles[requested])screen=requested;const requestedState=p.get('state');if(requestedState)state=requestedState;render()}

</script><!-- OPTIONAL_PREVIEW_START --><script>

function simulate(extra){const debts=[{id:'loan',b:152000,r:.08,min:2200},{id:'card',b:33000,r:.18,min:800}];debts.sort((a,b)=>strategy==='avalanche'?b.r-a.r||a.id.localeCompare(b.id):a.b-b.b||a.id.localeCompare(b.id));const budget=3000+extra;let interest=0;for(let month=1;month<=360;month++){for(const d of debts){const i=Math.round(d.b*d.r/12*100)/100;interest+=i;d.b+=i}let paid=0;for(const d of debts){const p=Math.min(d.min,d.b);d.b-=p;paid+=p}let rest=Math.max(0,budget-paid);for(const d of debts){const p=Math.min(rest,d.b);d.b-=p;rest-=p}if(debts.every(d=>d.b<.005))return {months:month,interest}}return {months:null,interest}}
function debtScreen(){const plan=simulate(500),minimum=simulate(0);const finish=plan.months?new Intl.DateTimeFormat('nb-NO',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(2026,9+plan.months,1))):'Ikke innen 30 år';return head('Mer kontroll på gjelden','Se dagens anslag og en mulig vei videre.',state==='Member'?null:'debt-new','Legg til gjeld')+gate('gjeld')+`<div class="mini-grid"><section class="card"><small>Estimert gjeld</small><h2 class="num mt">185 000 kr</h2></section><section class="card"><small>Gjeldfri i planen</small><h2 class="mt">${finish}</h2></section><section class="card"><small>Estimerte renter spart</small><h2 class="num mt">${money(minimum.interest-plan.interest)}</h2></section></div><div class="two-col"><section class="card"><h2>Gjeldsoversikt</h2>${[['Billån',152000,'8,0 %','2 200 kr'],['Kredittkort',33000,'18,0 %','800 kr']].map(d=>`<div class="savings-row mt"><div class="row"><strong>${d[0]}</strong><strong class="num">${money(d[1])}</strong></div><p>${d[2]} årlig rente · Minst ${d[3]} / mnd.</p><p>Saldo oppdatert 20. oktober 2026 · Fiktivt eksempel</p></div>`).join('')}</section><section class="card"><h2>Nedbetalingsplan</h2><div class="form-grid mt"><div><label for="strategy">Strategi</label><select id="strategy"><option value="avalanche" ${strategy==='avalanche'?'selected':''}>Høyeste rente først</option><option value="snowball" ${strategy==='snowball'?'selected':''}>Laveste saldo først</option></select></div><div class="math"><div class="row"><span>Minimumsbetalinger</span><strong>3 000 kr</strong></div><div class="row"><span>Ekstra per måned</span><strong>500 kr</strong></div><div class="row total"><span>Planlagt</span><strong>3 500 kr</strong></div></div></div><p class="subtle">${plan.months??'360+'} måneder i planen. Anslåtte renter: ${money(plan.interest)} med ekstra, ${money(minimum.interest)} uten ekstra. Renter beregnes månedlig, minstekrav først, resten til valgt prioritet. Frigjorte betalinger brukes videre. Maks 30 år.</p><div class="notice warning mt">Et anslag med faste renter og betalinger. Saldo, gebyrer og faktiske vilkår kan gi et annet resultat. Ingen betaling gjennomføres.</div><button class="link" data-action="debt-payment">Registrer gjeldsbetaling ↗</button></section></div>`}
function annualScreen(){return head('Store regninger. Små avsetninger.','Fordel årlige utgifter gjennom året.',state==='Member'?null:'annual-new','Ny årsutgift')+gate('arsutgifter')+`<div class="mini-grid"><section class="card"><small>Årsbeløp</small><h2 class="num mt">24 000 kr</h2></section><section class="card"><small>Settes av per måned</small><h2 class="num mt">2 000 kr</h2></section><section class="card"><small>Planlagt fondssaldo</small><h2 class="num mt">20 000 kr</h2></section></div><section class="card"><h2>Årsutgiftene våre</h2>${[['Bilforsikring',9600,800,8000,'November'],['Høytider',7200,600,6000,'Desember'],['Bil og vedlikehold',7200,600,6000,'Desember']].map(d=>`<div class="savings-row mt"><div class="row"><h3>${d[0]}</h3><strong>${money(d[2])} / mnd.</strong></div><p>${money(d[1])} per år · Forfall ${d[4]} · ${money(d[3])} planlagt avsatt</p><div class="bar mt" role="img" aria-label="${d[0]}: ${money(d[3])} av ${money(d[1])} planlagt finansiert"><i style="width:${100*d[3]/d[1]}%"></i></div></div>`).join('')}<div class="notice mt">Ved forsikringens forfall i november ventes 8 800 kr avsatt mot 9 600 kr: 800 kr mangler da. Dette er et fremtidig finansieringsgap, ikke en ny oktoberutgift. Fondssaldoen er en beregnet avsetning, ikke en hentet banksaldo. Når regningen registreres betalt fra fondet, trekkes ikke hele beløpet fra månedsbudsjettet en gang til. Et eventuelt udekket beløp må vises særskilt.</div><button class="link" data-action="annual-payment">Registrer betaling fra fond ↗</button></section>`}
function abroadScreen(){return head('Oversikt over det vi sender','Registrerte overføringer. Alltid forklart i NOK.','transfer-new','Registrer overføring')+gate('utland')+`<div class="mini-grid"><section class="card"><small>Sendt i oktober</small><h2 class="num mt">1 500 kr</h2></section><section class="card"><small>Sendt hittil i år</small><h2 class="num mt">12 000 kr</h2></section><section class="card"><small>Av årets mottatte inntekt</small><h2 class="num mt">2,0 %</h2></section></div><section class="card"><div class="card-head"><h2>Mottakere og registreringer</h2><span class="chip">Fiktivt eksempel</span></div><div class="bill"><span class="avatar">FM</span><div class="bill-text"><p>Familiemedlem · Sverige</p><small>15. oktober · 1 500 SEK</small></div><strong class="num">1 500 NOK</strong></div><div class="math mt"><div class="row"><span>Registrert kurs</span><strong>1 NOK / SEK</strong></div><div class="row"><span>Gebyr</span><strong>0 kr</strong></div></div><div class="notice warning mt">Kursen er et fiktivt eksempel. I appen oppgir dere faktisk NOK-beløp eller bekreftet kurs for hver registrering. Ukjent kurs gir feil, aldri et gjettet beløp.</div><p class="subtle">Overføringen er én utgift i budsjettet, også når den vises her. Appen sender ikke penger.</p><button class="link" data-action="recipient">Administrer mottakere ↗</button></section>`}
function yearScreen(){return head('Hele året, i ett blikk','2026 · historikk uten overføring av fritt overskudd.')+`<div class="notice">Årseksempel med fiktive summer. Grunnoversiktens moduler er ${Object.values(used).some(Boolean)?'delvis aktivert':'avslått'}. Årstabellen under illustrerer oppsettet og er et separat datasett.</div><section class="card"><h2>Budsjett mot faktisk</h2><div class="table-wrap mt"><table><thead><tr><th>Måned</th><th>Mottatt inntekt</th><th>Utgifter</th><th>Spareinnskudd</th><th>Kontantresultat</th></tr></thead><tbody>${[['August','62 000','41 000','6 000','15 000'],['September','62 000','40 000','6 000','16 000'],['Oktober (1.–20.)','62 000','28 450','4 500','29 050']].map(r=>'<tr>'+r.map((v,i)=>`<td data-label="${['Måned','Mottatt inntekt','Utgifter','Spareinnskudd','Kontantresultat'][i]}">${v}${i?' kr':''}</td>`).join('')+'</tr>').join('')}</tbody></table></div><p class="subtle">Kontantresultat og «igjen å bruke» er ulike mål. Oktober har i tillegg ubetalte regninger og avsetninger. Ingen av disse overskuddene øker neste måneds disponible beløp.</p></section><section class="card mt"><h2>Kategorier · månedsvis og hittil i år</h2><p class="muted mt">Den ferdige årsoversikten viser januar–desember, årsbudsjett, faktisk forbruk, avvik og akkumulert historisk resultat per kategori. Manglende måneder vises som «Ingen data», ikke som null.</p><button class="link" data-action="year-detail">Se foreslåtte kolonner ↗</button></section>`}
function customizeScreen(){return head('Akkurat det familien trenger','Start med oversikten. Velg resten selv.')+`${state==='Member'?'<div class="notice">Bare administratoren kan endre familiens oppsett.</div>':''}<section class="card"><h2>Valgfrie deler</h2><p class="subtle">Bryterne endrer bare dette designforslagets fiktive eksempel. Ingenting lagres.</p>${Object.entries(optionalMeta).map(([k,v])=>`<div class="bill"><div class="bill-text"><h3>${v[0]}</h3><small>${v[1]}</small></div><button role="switch" aria-checked="${enabled[k]}" aria-label="${v[0]}" data-toggle="${k}" ${state==='Member'?'disabled':''}>${enabled[k]?'På':'Av'}</button></div>`).join('')}<p class="subtle">I den ferdige appen må en modul med eksisterende poster arkiveres kontrollert. Å skjule en del sletter ikke historikk eller frigjør penger som allerede er bundet.</p></section><section class="card mt"><h2>Alltid tilgjengelig</h2><p class="muted mt">Inntekter, utgifter, kategorier, regninger, sparemål og historikk. Årsoversikt kan åpnes fra Mer.</p></section>`}
window.optionalScreens={gjeld:debtScreen,arsutgifter:annualScreen,utland:abroadScreen,arsoversikt:yearScreen,tilpass:customizeScreen};
more=function(){return head('Mer for familien','Verktøy som vokser med behovene deres.')+`<div class="menu-list">${['regninger','gjeld','arsutgifter','utland','arsoversikt','familie','tilpass'].map(k=>`<button data-go="${k}"><span>${titles[k]}${k in enabled?` <small>· ${enabled[k]?'Aktiv':'Valgfri'}</small>`:''}</span><span aria-hidden="true">↗</span></button>`).join('')}<button data-action="install"><span>Legg til på hjemskjermen</span><span aria-hidden="true">↗</span></button></div>`};
const originalRender=render;
render=function(){originalRender();const mobileKey=['regninger','familie','gjeld','arsutgifter','utland','arsoversikt','tilpass'].includes(screen);if(mobileKey){document.querySelector('#mobile-nav [data-go="mer"]').classList.add('active');document.querySelector('#mobile-nav [data-go="mer"]').setAttribute('aria-current','page')}
 if(screen==='oversikt'&&!visible.sparing){const card=document.querySelectorAll('.two-col')[1]?.lastElementChild;if(card){const parent=card.parentElement;card.remove();parent.style.gridTemplateColumns='1fr'}}

 if(screen==='oversikt'&&['Default','Member','Negative'].includes(state)){const a=allocation();document.querySelector('.hero .amount').innerHTML=`${new Intl.NumberFormat('nb-NO').format(a.available)} <span>kr</span>`;document.querySelector('.daily .amount').innerHTML=`${new Intl.NumberFormat('nb-NO').format(Math.floor(a.available/12))} <span>kr / dag</span>`;document.querySelector('.daily .eyebrow').textContent='Veiledende dagsbeløp';document.querySelectorAll('.mini .value')[0].textContent=money(a.income);document.querySelectorAll('.mini .value')[1].textContent=money(a.expense);if(a.available<0)document.querySelector('.hero p').textContent='Underskudd: registrerte inntekter dekker ikke alle avsetninger.';if(used.utland){document.querySelectorAll('.chart-col span')[2].textContent=money(a.expense);document.querySelector('.chart').setAttribute('aria-label',`1. til 20. august: 32 800 kr. September: 30 700 kr. Oktober: ${money(a.expense)}.`);document.querySelectorAll('.chart-col .chart-bar')[2].style.height=`${a.expense/32800*103}px`;document.querySelectorAll('.two-col')[1].querySelector('.chip').textContent='↓ 2,4 %';document.querySelectorAll('.two-col')[1].querySelector('.subtle').textContent='750 kr mindre enn samme periode i september.';document.querySelectorAll('.two-col')[0].querySelector('.subtle').textContent='Ubetalte regninger vises separat. Utland: 1 500 kr registrert i tillegg til kategoriene over.'}}
 if(state==='Member'&&screen==='sparing'){document.querySelector('.pagehead>button')?.remove();document.querySelectorAll('[data-action="goal-edit"]').forEach(b=>b.remove())}
 if(screen==='poster'){const headers=[...document.querySelectorAll('th')].map(x=>x.textContent);document.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>c.dataset.label=headers[i]))}
};

 const action=e.target.closest('[data-action]')?.dataset.action;if(action==='calculation'){e.stopImmediatePropagation();const a=allocation();dialog('Slik beregnes «igjen å bruke»',`<div class="math"><div class="row"><span>Mottatt inntekt</span><strong>${money(a.income)}</strong></div><div class="row"><span>Utgifter inkl. utland</span><strong>−${money(a.expense)}</strong></div><div class="row"><span>Ubetalte ordinære regninger</span><strong>−8 650 kr</strong></div><div class="row"><span>Satt av til sparing</span><strong>−6 500 kr</strong></div>${a.debt?'<div class="row"><span>Gjeld · plan/betalt</span><strong>−3 500 kr</strong></div>':''}${a.annual?'<div class="row"><span>Årsutgifter · avsetning</span><strong>−2 000 kr</strong></div>':''}<div class="row total"><span>Igjen å bruke</span><strong>${money(a.available)}</strong></div></div><p class="subtle">Buffer: max(4 000 plan, 4 500 innskudd). Sommerferie: max(2 000 plan, 0 innskudd). Ingen uttak i eksemplet. Hver betaling teller i bare én regnskapsgruppe.</p><p class="subtle">${money(a.available)} / 12 dager. Kortet viser hele kroner; beregning lagres i øre. Forventet inntekt og gammelt fritt overskudd er ikke med.</p>`)}
 const descriptions={'debt-new':['Legg til gjeld','Navn, saldo fra långiver, saldodato, årlig rente og minimum per måned. Bekreft saldoen jevnlig; dette er et anslag.'],'debt-payment':['Registrer gjeldsbetaling','Velg gjeld, betalingsdato og NOK-beløp. Betalingen erstatter reservert beløp i samme regnskapsgruppe; den telles ikke som vanlig utgift i tillegg.'],'annual-new':['Ny årsutgift','Navn, årsbeløp, forfallsmåned og allerede avsatt ved start. Månedsavsetningen er årsbeløpet fordelt på 12.'],'annual-payment':['Betaling fra årsutgiftsfond','Velg fond, dato og beløp. Bruk av avsatt fond trekkes ikke dobbelt. Udekket beløp vises som ekstra nødvendig avsetning.'],'transfer-new':['Registrer penger sendt','Mottaker, dato, beløp, valuta og faktisk NOK-beløp eller bekreftet kurs. For eksempel 1 500 SEK × 1 NOK/SEK = 1 500 NOK. Kursen her er fiktiv. Ingen penger sendes.'],'recipient':['Mottakere','Navn eller kallenavn, land/notat og vanlig valuta. Andre familier ser ikke opplysningene.'],'year-detail':['Kolonner i årsoversikten','Kategori, januar til desember, totalt faktisk, årsbudsjett og avvik. Oppsummering: inntekt, vanlige utgifter, utland, gjeldsbetaling, spareinnskudd, årsavsetning og akkumulert historisk resultat.'],'refund':['Registrer refusjon','Koble til opprinnelig utgift. Oppgi positivt tilbakebetalt beløp og faktisk mottaksdato. Beløpet reverserer samme regnskapsgruppe og kategori én gang.'],'withdraw':['Registrer uttak fra sparemål','Velg mål, dato og beløp. Uttaket reduserer målets fremdrift og vises separat som frigjorte sparepenger, ikke som lønnsinntekt. Beløpet kan ikke overstige registrert saldo.']};
 if(descriptions[action]){e.stopImmediatePropagation();const [t,d]=descriptions[action];dialog(t,`<p>${d}</p><p class="subtle">Detaljflyt til gjennomgang. Ingen opplysninger lagres.</p>`)}
},true);
